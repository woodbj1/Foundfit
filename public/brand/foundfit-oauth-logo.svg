<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FoundFit OAuth Logo</title>
  <desc id="desc">Square FoundFit logo with a custom FF monogram and forward chevron accent.</desc>
  <defs>
    <linearGradient id="bg" x1="76" y1="60" x2="438" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="0.52" stop-color="#ec4899" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="accent" x1="226" y1="176" x2="334" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef08a" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#312e81" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="52" y="52" width="408" height="408" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" />

  <g fill="#ffffff">
    <rect x="116" y="110" width="62" height="292" rx="31" />
    <rect x="116" y="110" width="192" height="58" rx="29" />
    <rect x="116" y="224" width="148" height="52" rx="26" />

    <rect x="284" y="110" width="62" height="292" rx="31" />
    <rect x="284" y="110" width="116" height="58" rx="29" />
    <rect x="284" y="224" width="96" height="52" rx="26" />
  </g>

  <path
    d="M236 194 L298 256 L236 318"
    fill="none"
    stroke="url(#accent)"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="28"
  />
</svg>
